[build-system]
# setuptools 77: SPDX license string (PEP 639); wheel 0.38.1: CVE-2022-40898 fixed
requires = ["setuptools>=77", "wheel>=0.38.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-usage-analyzer"
version = "0.7.0-beta"
description = "Calculate token usage statistics and map quotas for Amazon Bedrock models. Supports both standard AWS regions and AWS GovCloud (US) regions."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Amazon Web Services"}
]
keywords = ["aws", "bedrock", "cloudwatch", "metrics", "tokens", "usage", "statistics", "govcloud", "government"]

# Floors exclude releases with known CVEs or missing APIs. No upper bounds: this is a
# CLI installed next to other tools, and caps would block security fixes.
dependencies = [
    "boto3>=1.39.7",  # custom model deployment APIs (ListInferenceProfiles typeEquals: 1.35.51)
    "numpy>=1.22",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.1",
    "defusedcsv>=2.0",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/awslabs/bedrock-usage-analyzer"

[project.scripts]
bua = "bedrock_usage_analyzer.__main__:main"
bedrock-usage-analyzer = "bedrock_usage_analyzer.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bedrock_usage_analyzer = ["templates/*.html", "metadata/*.yml", "metadata/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]